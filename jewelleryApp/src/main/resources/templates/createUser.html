<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <!-- META -->
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <!-- BOOTSTRAP -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CUSTOM CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <!-- PAGE CSS -->
    <style>

        body {

            background-color: #f5f5f5;
        }

        .register-container {

            margin-top: 40px;
            margin-bottom: 40px;
        }

        .register-card {

            background: #ffffff;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0px 5px 20px rgba(0, 0, 0, 0.10);
        }

        .page-title {

            text-align: center;

            font-weight: bold;

            margin-bottom: 30px;

            color: #333;
        }

        .form-label {

            font-weight: 600;

            margin-bottom: 8px;
        }

        .form-control {

            border-radius: 10px;

            padding: 12px;
        }

        .register-btn {

            width: 100%;

            padding: 12px;

            font-size: 16px;

            font-weight: bold;

            border-radius: 10px;
        }

        .login-link {

            text-align: center;

            margin-top: 18px;
        }

        .login-link a {

            text-decoration: none;

            font-weight: 600;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            .register-card {

                padding: 20px;
            }

            .page-title {

                font-size: 24px;
            }
        }

    </style>

</head>

<body>

    <!-- HEADER -->
    <div th:replace="~{fragment/header :: header}">
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container register-container">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8 col-sm-12">

                <!-- CARD -->
                <div class="register-card">

                    <!-- TITLE -->
                    <h2 class="page-title">

                        Create Account

                    </h2>

                    <!-- FORM -->
                    <form th:action="@{/save_user}"
                          th:object="${user}"
                          method="post">

                        <!-- FULL NAME -->
                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   th:field="*{fullName}"
                                   class="form-control"
                                   placeholder="Enter Full Name">

                        </div>

                        <!-- EMAIL -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   placeholder="Enter Email">

                        </div>

                        <!-- MOBILE NUMBER -->
                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <input type="text"
                                   th:field="*{mobileNo}"
                                   class="form-control"
                                   placeholder="Enter Mobile Number">

                        </div>

                        <!-- PASSWORD -->
                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   placeholder="Enter Password">

                        </div>

                        <!-- CONFIRM PASSWORD -->
                        <div class="mb-4">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input type="password"
                                   name="confirmPassword"
                                   class="form-control"
                                   placeholder="Confirm Password">

                        </div>

                        <!-- REGISTER BUTTON -->
                        <button type="submit"
                                class="btn btn-success register-btn">

                            <i class="fa-solid fa-user-plus"></i>

                            Create Account

                        </button>

                    </form>

                    <!-- LOGIN LINK -->
                    <div class="login-link">

                        Already have an account?

                        <a th:href="@{/login}">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragment/footer :: footer}">
    </div>

</body>

</html>
