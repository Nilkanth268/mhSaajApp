<header th:fragment="header">

	<div class="header-container">

		<div class="logo">
			💎  Maharashtrian Saaj
		</div>

		<div class="menu-toggle" onclick="toggleMenu()">
			☰
		</div>

		<nav id="nav-menu">

			<ul>

				<!-- COLLECTION -->
				<li>
					<a th:href="@{/products}">
						Collections
					</a>
				</li>

				<!-- LOGIN -->
				<li th:if="${session.userId == null}">
					<a th:href="@{/login}">
						Login
					</a>
				</li>

				<!-- LOGOUT -->
				<li th:if="${session.userId != null}">
					<a th:href="@{/logout}">
						Logout
					</a>
				</li>

				<!-- 👑 ADMIN ONLY -->
				<li th:if="${session.role == 'ROLE_ADMIN'}">

					<a th:href="@{/user_form}">
						Add Product
					</a>

				</li>

				<li th:if="${session.userId == null}">

					<a th:href="@{/user_form}">
						Create User
					</a>

				</li>

			</ul>

		</nav>

	</div>

	<script>

		function toggleMenu() {

			document
				.getElementById("nav-menu")
				.classList
				.toggle("show-menu");
		}

	</script>

</header>
