<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- THEME COLOR VARIABLES --- */
        /* Change these hex codes to perfectly match your main page */
        :root {
            --bg-gradient-start: #0f172a; /* Deep slate dark background */
            --bg-gradient-end: #1e293b;
            --card-background: #ffffff;   /* Clean white card */
            --text-main: #1e293b;         /* Dark charcoal for headings */
            --text-muted: #64748b;        /* Cool gray for labels/placeholders */
            --primary-color: #4f46e5;     /* Vibrant indigo accent button */
            --primary-hover: #4338ca;     /* Darker indigo for hover state */
            --input-border: #cbd5e1;      /* Light gray border */
            --input-focus: #818cf8;       /* Focus ring color */
            --error-bg: #fef2f2;          /* Light red for error box */
            --error-text: #b91c1c;        /* Vivid red for error text */
        }

        /* --- Global Resets --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- Login Wrapper & Responsiveness --- */
        .login-wrapper {
            width: 100%;
            max-width: 420px; /* Perfect desktop width */
            animation: fadeIn 0.6s ease-out;
        }

        /* --- Elegant Glassmorphism / Drop Shadow Card --- */
        .login-card {
            background: var(--card-background);
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 
                        0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .login-card h2 {
            color: var(--text-main);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        /* Optional Subtitle */
        .login-card::after {
            content: "Welcome back! Please enter your details.";
            display: block;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
            font-weight: 400;
        }

        /* --- Form Styling --- */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            color: var(--text-main);
            background-color: transparent;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        /* Input Interaction States */
        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* --- Modern Button --- */
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        /* --- Beautiful Error Message Box --- */
        .error-container {
            margin-top: 20px;
            padding: 12px;
            background-color: var(--error-bg);
            border-left: 4px solid var(--error-text);
            border-radius: 6px;
            display: flex;
            align-items: center;
        }

        .error-text {
            color: var(--error-text);
            font-size: 13.5px;
            font-weight: 500;
        }

        /* --- Clean CSS Animation --- */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Mobile Responsiveness Adjustments --- */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }
            .login-card {
                padding: 32px 20px;
                border-radius: 12px;
            }
            .login-card h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <h2>Login</h2>

            <form th:action="@{/check-login}" method="post">

                <div class="input-group">
                    <label for="userMobileNo">Mobile Number</label>
                    <input type="text"
                           id="userMobileNo"
                           name="userMobileNo"
                           placeholder="Enter Mobile Number"
                           required>
                </div>

                <div class="input-group">
                    <label for="userPassword">Password</label>
                    <input type="password"
                           id="userPassword"
                           name="userPassword"
                           placeholder="Enter Password"
                           required>
                </div>

                <button type="submit">
                    Sign In
                </button>
            </form>

            <div class="error-container" th:if="${errorMsg != null}">
                <p class="error-text" th:text="${errorMsg}"></p>
            </div>

        </div>
    </div>

</body>
</html>
