<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title th:text="${product.pName}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<style>
		.carousel-main-img {
			width: 100%;
			height: 430px;
			object-fit: cover;
			border-radius: 12px;
		}
		.thumb-img {
			width: 70px;
			height: 70px;
			object-fit: cover;
			border-radius: 8px;
			cursor: pointer;
			border: 2px solid transparent;
			opacity: 0.7;
			transition: all 0.2s ease;
		}
		.thumb-img:hover, .thumb-img.active-thumb {
			border-color: #ffc107;
			opacity: 1;
			transform: scale(1.05);
		}
		@media (max-width: 576px) {
			.carousel-main-img {
				height: 320px;
			}
		}
	</style>
</head>

<body>

	<div th:replace="~{fragment/header :: header}"></div>

	<section class="container py-5">

		<div class="row g-5">

			<!-- IMAGE SLIDER / CAROUSEL -->
			<div class="col-lg-6">

				<div id="productCarousel" class="carousel slide shadow rounded" data-bs-ride="false">

					<!-- SLIDES -->
					<div class="carousel-inner rounded">

						<!-- Loop over all product images -->
						<div th:each="imgName, iterStat : ${product.imageList}"
							 th:class="${iterStat.first} ? 'carousel-item active' : 'carousel-item'">
							<img th:src="@{'/images/' + ${imgName}}"
								 class="d-block carousel-main-img"
								 alt="Jewellery Image">
						</div>

						<!-- Fallback if no images exist -->
						<div th:if="${#lists.isEmpty(product.imageList)}" class="carousel-item active">
							<img th:src="@{/images/default-jewel.jpg}"
								 class="d-block carousel-main-img"
								 alt="Default Image">
						</div>

					</div>

					<!-- PREV / NEXT ARROWS (Only shown if more than 1 photo) -->
					<button th:if="${#lists.size(product.imageList) > 1}"
							class="carousel-control-prev" type="button"
							data-bs-target="#productCarousel" data-bs-slide="prev">
						<span class="carousel-control-prev-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
						<span class="visually-hidden">Previous</span>
					</button>

					<button th:if="${#lists.size(product.imageList) > 1}"
							class="carousel-control-next" type="button"
							data-bs-target="#productCarousel" data-bs-slide="next">
						<span class="carousel-control-next-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
						<span class="visually-hidden">Next</span>
					</button>

				</div>

				<!-- CLICKABLE THUMBNAILS BELOW SLIDER -->
				<div th:if="${#lists.size(product.imageList) > 1}"
					 class="d-flex gap-2 justify-content-center mt-3 flex-wrap">
					<img th:each="imgName, iterStat : ${product.imageList}"
						 th:src="@{'/images/' + ${imgName}}"
						 th:class="${iterStat.first} ? 'thumb-img active-thumb' : 'thumb-img'"
						 th:onclick="'goToSlide(' + ${iterStat.index} + ', this)'">
				</div>

			</div>

			<!-- PRODUCT DETAILS -->
			<div class="col-lg-6">

				<h2 class="fw-bold text-dark" th:text="${product.pName}"></h2>

				<p class="text-muted fs-5">
					Category :
					<span th:text="${product.PCategory}"></span>
				</p>

				<h2 class="text-warning fw-bold mb-4">
					₹ <span th:text="${product.pAmount}"></span>
				</h2>

				<h5>Description</h5>
				<p class="text-secondary" th:text="${product.PDescription}"></p>

				<div class="mt-4 d-flex flex-column flex-sm-row gap-3 align-items-stretch align-items-sm-center">

					<button type="button"
							class="btn btn-warning btn-lg px-5 fw-bold"
							th:onclick="'addToCartWithAnimation(event, this, ' + ${product.pId} + ')'">
						🛒 Add To Cart
					</button>

					<!-- 👑 ADMIN ONLY DELETE BUTTON -->
					<form th:if="${session.role == 'ROLE_ADMIN'}"
						  th:action="@{/delProductById/{id}(id=${product.pId})}"
						  method="get"
						  class="m-0"
						  onsubmit="return confirm('Are you sure you want to delete this jewellery item?');">
						<button type="submit" class="btn btn-danger btn-lg px-4 w-100">
							🗑️ Delete
						</button>
					</form>

				</div>

				<hr>

				<ul class="list-unstyled">
					<li>✔ Handmade Jewellery</li>
					<li>✔ Premium Quality Finish</li>
					<li>✔ Lightweight Design</li>
					<li>✔ Secure Packaging</li>
				</ul>

			</div>

		</div>

	</section>

	<div th:replace="~{fragment/footer :: footer}"></div>

	<!-- SLIDER THUMBNAIL & FLY-TO-CART SCRIPT -->
	<script>
		// Switch slide when user taps a thumbnail
		function goToSlide(index, thumbEl) {
			const carouselEl = document.getElementById("productCarousel");
			const carousel = bootstrap.Carousel.getOrCreateInstance(carouselEl);
			carousel.to(index);

			document.querySelectorAll(".thumb-img").forEach(img => img.classList.remove("active-thumb"));
			thumbEl.classList.add("active-thumb");
		}

		// Sync active thumbnail border when user swipes or clicks Next/Prev arrows
		document.addEventListener("DOMContentLoaded", () => {
			const carouselEl = document.getElementById("productCarousel");
			if (carouselEl) {
				carouselEl.addEventListener("slid.bs.carousel", (event) => {
					const thumbs = document.querySelectorAll(".thumb-img");
					thumbs.forEach(img => img.classList.remove("active-thumb"));
					if (thumbs[event.to]) {
						thumbs[event.to].classList.add("active-thumb");
					}
				});
			}
		});

		// Fly currently active slide image to the navbar cart
		function addToCartWithAnimation(event, button, productId) {
			const cartIcon = document.getElementById("navbar-cart");
			if (!cartIcon) return;

			const btnRect = button.getBoundingClientRect();
			const cartRect = cartIcon.getBoundingClientRect();

			const flyer = document.createElement("div");
			flyer.className = "flying-item";

			const activeImg = document.querySelector("#productCarousel .carousel-item.active img");
			if (activeImg && activeImg.src) {
				flyer.style.backgroundImage = `url('${activeImg.src}')`;
				flyer.style.backgroundSize = "cover";
				flyer.style.backgroundPosition = "center";
				flyer.style.border = "2px solid #ffc107";
			} else {
				flyer.innerText = "🛒";
			}

			flyer.style.left = (btnRect.left + btnRect.width / 2 - 22) + "px";
			flyer.style.top = (btnRect.top + btnRect.height / 2 - 22) + "px";
			document.body.appendChild(flyer);

			requestAnimationFrame(() => {
				flyer.style.left = (cartRect.left + cartRect.width / 2 - 15) + "px";
				flyer.style.top = (cartRect.top + cartRect.height / 2 - 15) + "px";
				flyer.style.transform = "scale(0.3)";
				flyer.style.opacity = "0.4";
			});

			fetch(`/cart/add/${productId}`, { method: "POST" })
				.then(res => res.json())
				.then(updatedCart => {
					setTimeout(() => {
						flyer.remove();
						if (typeof updateCartUI === "function") {
							updateCartUI(updatedCart);
						}
						cartIcon.classList.remove("cart-shake");
						void cartIcon.offsetWidth;
						cartIcon.classList.add("cart-shake");
					}, 750);
				});
		}
	</script>

</body>

</html>
