<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Product</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <h2>Add Product</h2>

    <form th:action="@{/admin/save_product}" th:object="${product}" method="post">

        <div class="mb-3">
            <label>Product Name</label>
            <input type="text" th:field="*{pName}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Price</label>
            <input type="number" th:field="*{pPrice}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea th:field="{pDescription}" class="form-control"></textarea>
        </div>

        <button class="btn btn-success">Save Product</button>

    </form>

</div>

</body>
</html>
