<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Add Product</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div th:replace="fragment/header :: header"></div>

	<div class="container mt-5">

		<h2>Add Product</h2>

		<form th:action="@{/admin/save_product}" th:object="${product}" method="post">

			<div class="mb-3">
				<label>Product Code</label>
				<input type="text" th:field="*{pCode}" class="form-control" />
			</div>

			<div class="mb-3">
				<label>Product Name</label>
				<input type="text" th:field="*{pName}" class="form-control" />
			</div>

			<div class="mb-3">
				<label>Product Category</label>
				<input type="text" th:field="*{pCategory}" class="form-control" />
			</div>

			<div class="mb-3">
				<label>Description</label>
				<textarea type="text" th:field="*{pDescription}" class="form-control"></textarea>
			</div>

			<div class="mb-3">
				<label>Price</label>
				<div class="input-group">
					<span class="input-group-text" id="price-addon">₹</span>
					<input type="number" th:field="*{pAmount}" class="form-control" placeholder="0.00"
						aria-describedby="price-addon" />
				</div>
			</div>

			<button class="btn btn-success">Save Product</button>

		</form>

	</div>

	<div th:replace="fragment/footer :: footer"></div>

</body>

</html>
